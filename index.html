<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1538">
<title>Pour Gloria 💌</title>
<meta name="description" content="Une petite surprise rien que pour toi.">
<meta property="og:title" content="Pour Gloria 💌">
<meta property="og:description" content="Une petite surprise rien que pour toi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F0FF; --bg2:#E6DAFA; --ink:#2A1F4F; --muted:#6B5E96;
  --gold:#B87A0C; --rose:#C9456B; --violet:#6D4BD8; --card:#FFFFFF; --line:rgba(42,31,79,.15);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1538; --bg2:#2A2156; --ink:#FFF4E6; --muted:#C9BFE8;
    --gold:#F4C45A; --rose:#F07A98; --violet:#8B6CF0; --card:#2B2359; --line:rgba(255,244,230,.16);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1538; --bg2:#2A2156; --ink:#FFF4E6; --muted:#C9BFE8;
  --gold:#F4C45A; --rose:#F07A98; --violet:#8B6CF0; --card:#2B2359; --line:rgba(255,244,230,.16);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;overflow-x:hidden;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;
  color:var(--ink);
  font-family:"Fraunces",Georgia,"Times New Roman",serif;
  font-size:1.0625rem;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:20}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .2s}
main{position:relative;z-index:1;max-width:30rem;margin:0 auto;padding:1.25rem 1.25rem 2.5rem;min-height:100%;display:flex;flex-direction:column}
.sound{position:fixed;top:calc(env(safe-area-inset-top,0px) + .75rem);right:.75rem;z-index:30;width:2.6rem;height:2.6rem;border-radius:50%;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05rem;cursor:pointer}
.path{display:flex;align-items:center;justify-content:center;margin:.6rem 0 1.8rem}
.path span{width:.7rem;height:.7rem;border-radius:50%;border:2px solid var(--gold);flex:none;transition:background .4s}
.path span.done{background:var(--gold)}
.path i{width:1.4rem;height:2px;background:var(--line)}
.path i.done{background:var(--gold)}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.1rem;animation:enter .6s ease both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-weight:600;font-size:2.2rem;line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-weight:600;font-size:1.65rem;line-height:1.2;margin:0}
.when{color:var(--muted);font-size:.95rem;margin:0}
p{margin:0;max-width:26rem}
.hand{font-family:"Caveat","Segoe Print","Bradley Hand",cursive;font-size:1.6rem;line-height:1.3}
.hand.appear{animation:enter .8s ease both}
.btn{font:inherit;font-weight:600;border:0;cursor:pointer;background:var(--rose);color:#fff;border-radius:999px;padding:.9rem 1.8rem;margin-top:.4rem;
  box-shadow:0 10px 30px -12px var(--rose)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hidden{display:none !important}
.emoji-lg{font-size:3.4rem;margin-top:2.5rem}

/* intro cinématique */
.cinema{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;min-height:70vh}
.cine-line{font-size:1.35rem;animation:enter 1.1s ease both}
.title-big{font-size:clamp(3.4rem,17vw,5.2rem);font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--gold);margin-top:.6rem}
.title-big span{display:inline-block;opacity:0;transform:translateY(24px) scale(.7);animation:letter .8s cubic-bezier(.2,.8,.2,1.3) forwards}
@keyframes letter{to{opacity:1;transform:none}}

/* étape 1 : le téléphone */
.phone{width:11.5rem;height:20.5rem;border-radius:2rem;border:0;padding:.55rem;background:#0d0a1f;cursor:pointer;
  box-shadow:0 0 0 2px var(--line),0 24px 50px -20px #000a}
.phone .scr{width:100%;height:100%;border-radius:1.5rem;background:#15112b;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.6rem;padding-bottom:1.5rem;color:#fff;position:relative;overflow:hidden;transition:background 1s}
.phone.full .scr{background:linear-gradient(160deg,#F07A98,#6D4BD8)}
.phone .pc{font-family:"Fraunces",Georgia,serif;font-size:2.2rem;font-weight:600}
.phone .bar{width:60%;height:1rem;border:2px solid #fff;border-radius:.3rem;padding:2px}
.phone .bar span{display:block;height:100%;width:5%;background:#E5484D;border-radius:.15rem;transition:width .35s ease,background .35s ease}
.phone .bolt{font-size:1.6rem;opacity:0;transition:opacity .2s}
.phone.charging .bolt{opacity:1}
.phone .notifs{position:absolute;left:.5rem;right:.5rem;top:.7rem;z-index:4;display:flex;flex-direction:column;gap:.35rem;pointer-events:none}
.phone .notif{background:rgba(255,255,255,.96);color:#2A1F4F;border-radius:1rem;padding:.5rem .65rem;
  font-family:system-ui,-apple-system,sans-serif;font-size:.72rem;line-height:1.3;text-align:left;
  box-shadow:0 6px 16px -8px #000a;
  opacity:0;transform:translateY(-220%) scale(.96);
  transition:transform .55s cubic-bezier(.2,.8,.2,1.25),opacity .3s ease}
.phone .notif.in{opacity:1;transform:none}
.phone .tapme{font-family:system-ui,sans-serif;font-size:.75rem;opacity:.6}

/* étape 2 : cartes */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;width:100%}
.flip{perspective:900px;border:0;padding:0;background:none;height:11.5rem;cursor:pointer;font:inherit;color:inherit}
.flip .in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.8rem;gap:.35rem}
.flip .f{background:var(--card);border:1.5px solid var(--line);font-weight:600;line-height:1.25}
.flip .f .ic{font-size:2.1rem}
.flip.star .f{border:2px solid var(--gold)}
.flip .badge{font-size:.75rem;font-weight:400;color:var(--gold)}
.flip .b{background:linear-gradient(160deg,var(--rose),var(--violet));color:#fff;transform:rotateY(180deg);
  font-family:"Caveat","Segoe Print",cursive;font-size:1.25rem;line-height:1.2}

/* étape 3 : la plage */
.beach{position:relative;width:100%;height:18rem;border-radius:1.25rem;overflow:hidden;
  background:linear-gradient(180deg,#FFB38A 0%,#F7A1B5 30%,#B9A3E3 48%)}
.beach .sun{position:absolute;left:50%;top:20%;width:4.6rem;height:4.6rem;margin-left:-2.3rem;border-radius:50%;
  background:radial-gradient(#FFF0B8,#FFB347);box-shadow:0 0 50px #FFD27A}
.beach .sea{position:absolute;left:0;right:0;top:46%;height:28%;background:linear-gradient(180deg,#4F7FC4,#3A62A6);overflow:hidden}
.beach .wave{position:absolute;left:0;top:0;width:200%;height:1.4rem;animation:wave 7s linear infinite}
.beach .wave.w2{top:auto;bottom:-.3rem;opacity:.6;animation-duration:5s;animation-direction:reverse}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.beach .sand{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(180deg,#F5DDB0,#E9C38A)}
.beach .person{position:absolute;z-index:6;border:0;background:none;cursor:pointer;font-size:1.9rem;line-height:1;padding:.3rem;transform:translate(-50%,-50%);
  transition:opacity .5s ease,transform .5s ease}
.beach .person.gone{opacity:0;transform:translate(-50%,-90%) scale(.3);pointer-events:none}
.beach .couple{position:absolute;left:50%;top:80%;transform:translate(-50%,-50%);font-size:2.5rem;line-height:1;transition:transform 1s ease,filter 1s ease}
.beach.alone .couple{transform:translate(-50%,-55%) scale(1.35);filter:drop-shadow(0 0 14px #fff)}
.float-heart{position:absolute;top:70%;color:#F07A98;font-size:1.3rem;opacity:0;animation:floatUp 2.6s ease-out forwards;pointer-events:none}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-10rem) scale(1.2)}}
.beach .bphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease;z-index:5;pointer-events:none}
.beach .bphoto.on{opacity:1}
.photo{margin:0;width:100%}
.photo img,.photo video{display:block;width:100%;height:auto;border-radius:1.1rem;box-shadow:0 18px 40px -20px #000a}
.hero{position:relative;width:100%;aspect-ratio:9/16;max-height:62vh;margin:0 auto;border-radius:1.25rem;overflow:hidden;background:#000;box-shadow:0 24px 50px -24px #000a;animation:enter 1s ease both}
.hero video{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 -70px 70px -40px rgba(0,0,0,.6)}

/* étape 4 : la tempête */
.stormbox{position:relative;width:100%;height:17rem;border-radius:1.25rem;overflow:hidden;background:linear-gradient(180deg,#262A40,#484D6B)}
.stormbox::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#7EC8F2,#F7C6D9);opacity:0;transition:opacity 1.6s ease}
.stormbox.clear::after{opacity:1}
.stormbox canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.cloudbtn{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%);font-size:5.5rem;line-height:1;border:0;background:none;cursor:pointer;transition:transform .2s ease}
.rainbow{position:absolute;left:14%;top:10%;z-index:2;font-size:3.2rem;animation:enter 1.2s ease both}
.meter{width:70%;height:.5rem;background:var(--line);border-radius:999px;overflow:hidden}
.meter b{display:block;height:100%;width:0;background:var(--gold);transition:width .25s ease}

/* étape 5 : quiz */
.choices{display:grid;gap:.7rem;width:100%}
.choices .btn{margin:0;width:100%}
.choices .btn.picked{border-color:var(--gold)}
.reply{min-height:2.2rem}

/* finale : gâteau */
.cake{position:relative;width:15rem;margin:1.2rem auto .4rem}
.candles{display:flex;justify-content:center;gap:1.1rem;height:5.2rem;align-items:flex-end}
.candle{position:relative;width:.75rem;height:3.2rem;border:0;padding:0;cursor:pointer;border-radius:.2rem;
  background:repeating-linear-gradient(135deg,#fff 0 6px,#F07A98 6px 12px)}
.flame{position:absolute;left:50%;bottom:100%;width:1rem;height:1.6rem;margin-left:-.5rem;margin-bottom:.15rem;
  border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#fff 0 18%,#FFD36B 30%,#FF9A3C 70%,transparent 72%);
  box-shadow:0 0 18px 4px rgba(255,190,90,.45);
  transform-origin:50% 90%;animation:flicker .18s infinite alternate}
.candle.out .flame{opacity:0;transform:scale(.2);transition:opacity .35s,transform .35s;animation:none}
.candle.out::after{content:"";position:absolute;left:50%;bottom:100%;width:2px;height:1.2rem;margin-left:-1px;background:linear-gradient(transparent,#aaa8);opacity:0;animation:smoke 1.4s ease-out forwards}
@keyframes flicker{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.92,1.08) rotate(2deg)}}
@keyframes smoke{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-1.5rem) scaleX(3)}}
.tier{margin:0 auto;border-radius:.6rem .6rem .4rem .4rem;position:relative}
.tier.top{width:11rem;height:3.4rem;background:#E86A8C}
.tier.bottom{width:15rem;height:4.4rem;background:#8C5A3C;margin-top:-.2rem}
.tier.top::before,.tier.bottom::before{content:"";position:absolute;left:0;right:0;top:0;height:1rem;border-radius:.6rem .6rem 50% 50%/.6rem .6rem 1rem 1rem;background:#FFF4E6}
.tier.bottom::after{content:"";position:absolute;left:10%;right:10%;bottom:1.1rem;height:.35rem;border-radius:999px;background:repeating-linear-gradient(90deg,#F4C45A 0 .5rem,transparent .5rem 1rem)}
.plate{width:17rem;height:.7rem;margin:-.1rem auto 0;border-radius:50%;background:var(--line)}
.status{color:var(--muted);min-height:1.6rem;font-size:.95rem}

/* célébration */
.big-bday{font-size:clamp(2.4rem,11vw,3.4rem);color:var(--gold);margin-top:.5rem}
.gallery{position:relative;width:100%;aspect-ratio:4/5;border-radius:1.25rem;overflow:hidden;background:var(--card);box-shadow:0 24px 50px -24px #000a}
.slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.slide.on img{animation:kb 7s ease-out forwards}
.gbar{position:absolute;left:0;top:0;height:3px;width:100%;background:rgba(255,255,255,.25);z-index:6}
.gbar b{display:block;height:100%;width:0;background:var(--gold)}
.gallery{cursor:pointer}
.gtag{position:absolute;right:.6rem;top:.6rem;z-index:6;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;font-size:.7rem;padding:.15rem .55rem;letter-spacing:.04em}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.slide figcaption{position:absolute;left:0;right:0;bottom:0;padding:2rem 1rem .8rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.letter{background:var(--card);border:1.5px solid var(--line);border-radius:1.25rem;padding:1.4rem 1.3rem;text-align:left;width:100%;cursor:pointer;min-height:8rem}
.letter p{max-width:none;margin:0 0 .7rem}
.letter .sign{text-align:right;margin:0;font-size:1.9rem}
.skip{font-size:.85rem;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  .flame,.beach .wave,.slide.on img{animation:none}
  .screen,.cine-line,.hand.appear{animation:none}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<button class="sound hidden" id="sound" aria-label="Couper la musique">🔊</button>
<main>
  <nav class="path" id="path" aria-label="Progression"></nav>
  <section class="screen" id="stage" aria-live="polite"></section>
</main>

<script>
/* ================= TEXTES ET PHOTOS À PERSONNALISER ================= */
const CONFIG = {
  elle: "Gloria",
  moi: "Mohamed",
  cinema: ["Il était une fois…", "un téléphone à 0 %…", "et une histoire qui allait tout changer."],
  debut: {
    quand: "Janvier 2026",
    titre: "Grâce à une batterie à plat",
    consigne: "Ton téléphone est presque déchargé. Touche-le pour le recharger.",
    notif: "<b>Mohamed</b><br>Salut… je peux avoir ton numéro ? 😊",
    notif2: "<b>Mohamed</b><br>Et si c'est pour ne pas répondre, ne me le donne pas 😂",
    souvenir: [
      "Ce jour-là, ta batterie t'a lâchée et tu es entrée dans une boutique emprunter un chargeur. Je suis arrivé, je t'ai vue, et tu m'as plu tout de suite. J'ai osé te parler, et je suis reparti avec ton numéro.",
      "Dès nos premières conversations, le feeling est passé. Moi qui ne croyais plus en l'amour, tu m'as redonné l'envie d'aimer.",
      "Si ta batterie avait tenu ce jour-là, on ne se serait peut-être jamais rencontrés."
    ]
  },
  jaime: [
    { ic: "😊", titre: "Ton sourire", star: true, texte: "Ce que j'aime le plus au monde. Un sourire de toi, et tout va mieux." },
    { ic: "💬", titre: "Ta façon de parler", texte: "Ta voix, tes mots, ta manière de dire les choses. Je t'écouterais des heures." },
    { ic: "👑", titre: "Ta démarche", texte: "Quand tu marches, on dirait une reine. Et moi, je ne vois que toi." },
    { ic: "🤍", titre: "Ta façon de m'aimer", texte: "Tu me traites comme si j'étais ton tout. Personne ne m'avait fait ressentir ça." }
  ],
  plage: {
    quand: "Nos sorties",
    titre: "Seuls au monde",
    consigne: "À la plage, il y avait du monde autour de nous. Touche les passants pour les faire disparaître.",
    texte: [
      "On s'amusait comme des gosses, et les gens nous regardaient passer. Mais on ne voyait rien : ni les regards, ni le bruit.",
      "Je ne voyais que toi, et tu ne voyais que moi. C'était simple, mais c'était sincère."
    ]
  },
  tempete: {
    titre: "Les tempêtes",
    consigne: "On n'a pas toujours eu du beau temps. Touche le nuage pour le chasser.",
    apres: [
      "Je suis arrivé avec mes blessures. Il y a eu des disputes, des jours où on a failli tout arrêter. Mais à chaque fois, la même évidence : je ne vois pas ma vie sans toi.",
      "Je n'arrive pas encore à tout gérer, mais grâce à toi et à la force que tu me donnes, je tiens bon.",
      "Et toi, tu as traversé des épreuves que peu de gens auraient supportées. Tu as souffert, mais tu as toujours gardé le cap. Tu es la femme la plus forte que je connaisse."
    ]
  },
  quiz: {
    question: "À ton avis, qu'est-ce qui nous a réunis ?",
    choix: [
      { label: "Le destin", reponse: "Oui… avec un petit coup de main de ta batterie 😄" },
      { label: "Mohamed qui a osé parler", reponse: "Je confirme, il fallait du courage 😎" },
      { label: "Un téléphone à 0 %", reponse: "Le plus beau bug de ma vie 🔋❤️" }
    ]
  },
  finale: {
    titre: "Fais un vœu…",
    consigne: "…puis souffle sur ton téléphone pour éteindre les bougies."
  },
  // Ta musique : un fichier "musique.mp3" à côté de index.html.
  musique: "musique.mp3",
  volume: 0.32, // volume de la musique, de 0 a 1
  musiqueDebut: 0, // en secondes, pour sauter l'intro de la chanson (ex : 15)
  // Tes photos dans le dossier "photos", avec exactement ces noms (en .jpg).
  // Une photo absente est simplement ignorée.
  photosPlage: ["photos/plage1.jpg", "photos/plage2.mp4"],
  // Vidéo mise en avant juste avant la lettre (mets "" pour l'enlever).
  videoHero: "photos/glo.mp4",
  // Diaporama final : photos (.jpg) et vidéos (.mp4) mélangées, dans l'ordre.
  photos: [
    { src: "photos/1.jpg", legende: "" },
    { src: "photos/1.mp4", legende: "" },
    { src: "photos/2.jpg", legende: "" },
    { src: "photos/2.mp4", legende: "" },
    { src: "photos/3.jpg", legende: "" },
    { src: "photos/3.mp4", legende: "" },
    { src: "photos/4.jpg", legende: "" },
    { src: "photos/4.mp4", legende: "" },
    { src: "photos/5.jpg", legende: "" },
    { src: "photos/glo1.mp4", legende: "" }
  ],
  lettre: [
    "Gloria,",
    "Ce jour de janvier, un téléphone déchargé m'a mené jusqu'à toi. Je ne croyais plus en l'amour, et puis tu es arrivée avec ton sourire, et tu m'as redonné l'envie d'aimer.",
    "Je repense à nos journées à la plage, quand on riait comme des enfants et que plus rien d'autre n'existait. C'était simple, mais c'était vrai.",
    "Tu me traites comme si j'étais ton tout, et la force que tu me donnes m'aide à tenir, même dans les jours difficiles.",
    "Tu as traversé des épreuves que peu de gens auraient supportées, et tu as toujours tenu bon. Je te vois avancer chaque jour, devenir encore plus la femme forte que j'admire. Et je sais qu'un jour, je vous rendrai heureuses et fières, toi et Raïnha.",
    "Aujourd'hui, c'est ton jour. Je te souhaite tout le bonheur que tu mérites, et même plus.",
    "Joyeux anniversaire, mon amour."
  ]
};
/* ==================================================================== */

const stage = document.getElementById("stage");
const pathEl = document.getElementById("path");
const flashEl = document.getElementById("flash");
const soundBtn = document.getElementById("sound");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const TOTAL = 6;
let step = 0, cleanups = [];

function $(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function onCleanup(f){ cleanups.push(f); }
function later(fn, ms){ const id=setTimeout(fn, ms); onCleanup(()=>clearTimeout(id)); }
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function nextBtn(label="Étape suivante"){ const b=$("button","btn",label); b.onclick=()=>go(step+1); return b; }
function reveal(texts){ texts.forEach((t,i)=>{ const p=$("p","hand appear",t); p.style.animationDelay=(i*0.5)+"s"; stage.append(p); }); }
function restartAnim(){ stage.classList.remove("screen"); void stage.offsetWidth; stage.classList.add("screen"); }

function drawPath(n){
  pathEl.innerHTML="";
  for(let i=0;i<TOTAL;i++){
    if(i>0){ const l=$("i"); if(i<n) l.className="done"; pathEl.append(l); }

/* ---------- Musique (mélodie originale générée en direct) ---------- */
const Music = {
  el:null, on:false, sfx:null, ft:null,
  start(){
    const C=window.AudioContext||window.webkitAudioContext;
    if(C && !this.sfx){ try{ this.sfx=new C(); }catch(e){} }
    if(this.el){ if(this.on) this.el.play().catch(()=>{}); return; }
    this.on=true;
    if(!CONFIG.musique) return;
    const a=this.el=new Audio(CONFIG.musique);
    a.loop=true; a.preload="auto"; a.volume=0;
    a.addEventListener("loadedmetadata",()=>{ if(CONFIG.musiqueDebut) try{ a.currentTime=CONFIG.musiqueDebut; }catch(e){} },{once:true});
    a.play().then(()=>{ soundBtn.classList.remove("hidden"); this.fade(CONFIG.volume==null?.32:CONFIG.volume); }).catch(()=>{ soundBtn.classList.add("hidden"); });
  },
  fade(target){
    const a=this.el; if(!a) return; clearInterval(this.ft);
    this.ft=setInterval(()=>{ const d=target-a.volume; if(Math.abs(d)<.02){ a.volume=target; clearInterval(this.ft); return; } a.volume=Math.max(0,Math.min(1,a.volume+Math.sign(d)*.02)); }, 90);
  },
  setOn(v){ this.on=v; if(!this.el) return; if(v) this.el.play().catch(()=>{}); else this.el.pause(); },
  duck(d){ if(!this.el||!this.on) return; if(d) this.el.pause(); else this.el.play().catch(()=>{}); },
  chime(){
    const c=this.sfx; if(!c||!this.on) return;
    const t=c.currentTime;
    [1046.5,1318.5,1568,2093].forEach((f,i)=>{
      const o=c.createOscillator(), g=c.createGain(), st=t+i*.08;
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(.022,st+.015); g.gain.exponentialRampToValueAtTime(.0001,st+1);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st+1.05);
    });
  }
};
soundBtn.onclick=()=>{ Music.setOn(!Music.on); soundBtn.textContent=Music.on?"🔊":"🔇"; soundBtn.setAttribute("aria-label", Music.on?"Couper la musique":"Remettre la musique"); };

const VIDEO_RE=/\.(mp4|webm|mov|m4v|ogv)$/i;
function isVideo(src){ return VIDEO_RE.test(src||""); }
function makeMedia(src, cls, alt, onOk, onFail){
  if(isVideo(src)){
    const v=document.createElement("video");
    if(cls) v.className=cls;
    v.muted=true; v.defaultMuted=true; v.loop=true; v.playsInline=true; v.preload="auto";
    v.setAttribute("muted",""); v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline","");
    v.setAttribute("aria-label", alt||"Vidéo de nous");
    v.onloadeddata=()=>{ const f=onOk; onOk=null; if(f) f(v); };
    v.onerror=()=>{ const f=onFail; onFail=null; if(f) f(); };
    v.src=src; return v;
  }
  const im=new Image(); if(cls) im.className=cls; im.alt=alt||"";
  im.onload=()=>onOk&&onOk(im); im.onerror=()=>onFail&&onFail();
  im.src=src; return im;
}

function startMic(status, btn, onBlow){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ status.textContent="Le micro n'est pas disponible ici. Touche les bougies pour les éteindre."; btn.remove(); return; }
  const C=window.AudioContext||window.webkitAudioContext; const ctx=new C();
  if(ctx.resume) ctx.resume();
  Music.duck(true);
  status.textContent="Autorise le micro quand ton téléphone te le demande.";
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(stream=>{
    if(ctx.resume) ctx.resume();
    const an=ctx.createAnalyser(); an.fftSize=1024; ctx.createMediaStreamSource(stream).connect(an);
    const data=new Uint8Array(an.fftSize);
    audio={ctx,stream,raf:0};
    btn.remove(); status.textContent="Vas-y, souffle fort vers le bas de ton téléphone 💨";
    const lv=$("div","meter mic","<b></b>"); status.before(lv); const bar=lv.firstChild;
    let base=0, frames=0, loud=0, cool=0;
    const loop=()=>{
      an.getByteTimeDomainData(data);
      let s=0; for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; s+=v*v; }
      const rms=Math.sqrt(s/data.length);
      frames++;
      if(frames<30) base=Math.max(base,rms);
      const thr=Math.min(.15, Math.max(.05, base*2.5));
      bar.style.width=Math.min(100, rms/thr*70)+"%";
      if(cool>0) cool--;
      if(frames>=30){
        loud = rms>thr ? loud+1 : Math.max(0,loud-1);
        if(loud>5 && cool===0){ onBlow(); loud=0; cool=10; }
      }
      if(audio) audio.raf=requestAnimationFrame(loop);
    };
    loop();
  }).catch(()=>{
    try{ ctx.close(); }catch(e){}
    Music.duck(false);
    status.textContent="Le micro n'a pas été autorisé. Touche les bougies pour les éteindre."; btn.remove();
  });
}
function stopMic(){
  if(!audio) return;
  cancelAnimationFrame(audio.raf);
  audio.stream.getTracks().forEach(t=>t.stop());
  try{ audio.ctx.close(); }catch(e){}
  audio=null; Music.duck(false);
  document.querySelectorAll(".meter.mic").forEach(e=>e.remove());
}

/* ---------- Effets ---------- */
function fireworks(ms=10000){
  if(reduce) return;
  const cv=document.getElementById("fx"), cx=cv.getContext("2d"), dpr=window.devicePixelRatio||1;
  const W=innerWidth, H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#F4C45A","#F07A98","#C9BFE8","#FFFFFF","#7FD1FF"];
  let parts=[]; const t0=performance.now(); let last=-1e9;
  const burst=()=>{
    const x=W*(.15+Math.random()*.7), y=H*(.12+Math.random()*.35), c=cols[Math.floor(Math.random()*cols.length)], n=70;
    for(let i=0;i<n;i++){ const a=Math.PI*2*i/n, s=1.5+Math.random()*3.2; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c,h:Math.random()<.08}); }
  };
  const tick=t=>{
    cx.globalCompositeOperation="destination-out"; cx.fillStyle="rgba(0,0,0,.22)"; cx.fillRect(0,0,W,H);
    cx.globalCompositeOperation="lighter";
    if(t-t0<ms && t-last>550){ burst(); last=t; }
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.035; p.vx*=.985; p.vy*=.985; p.life-=.012;
      cx.globalAlpha=Math.max(0,p.life); cx.fillStyle=p.c;
      if(p.h){ cx.font="15px serif"; cx.fillText("❤",p.x,p.y); } else { cx.beginPath(); cx.arc(p.x,p.y,2,0,6.283); cx.fill(); }
    });
    cx.globalAlpha=1; parts=parts.filter(p=>p.life>0);
    if(t-t0<ms || parts.length) requestAnimationFrame(tick);
    else { cx.globalCompositeOperation="source-over"; cx.clearRect(0,0,W,H); }
  };
  requestAnimationFrame(tick);
}

(function ambient(){
  if(reduce) return;
  const cv=document.getElementById("bg"), cx=cv.getContext("2d"), dpr=window.devicePixelRatio||1;
  let W, H;
  const size=()=>{ W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); };
  size(); addEventListener("resize", size);
  const col=getComputedStyle(document.documentElement).getPropertyValue("--gold").trim()||"#F4C45A";
  const ps=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.8,v:.12+Math.random()*.35,p:Math.random()*6.28}));
  const tick=()=>{
    cx.clearRect(0,0,W,H); cx.fillStyle=col;
    ps.forEach(q=>{ q.y-=q.v; q.p+=.03; if(q.y<-5){ q.y=H+5; q.x=Math.random()*W; }
      cx.globalAlpha=.2+.4*Math.sin(q.p)**2; cx.beginPath(); cx.arc(q.x,q.y,q.r,0,6.283); cx.fill(); });
    requestAnimationFrame(tick);
  };
  tick();
})();

const SCREENS=[intro, batterie, aime, plage, tempete, quiz, finale];
go(0);
